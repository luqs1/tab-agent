<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tab-agent</title>
    <style>
      body { font: 14px/1.5 ui-monospace, monospace; margin: 0; background: #0b0e14; color: #c9d1d9; }
      header { padding: 12px 16px; border-bottom: 1px solid #1f2630; display: flex; gap: 8px; align-items: center; }
      header b { color: #58a6ff; }
      button { font: inherit; background: #1f6feb; color: #fff; border: 0; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #log { white-space: pre-wrap; padding: 16px; margin: 0; height: calc(100vh - 140px); overflow: auto; }
      footer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #1f2630; }
      input { font: inherit; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 8px; }
      #msg { flex: 1; }
      .status { font-size: 12px; color: #8b949e; }
    </style>
    <!-- Pyodide from CDN: avoids bundling ~10MB of wasm during the sketch phase. -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"></script>
  </head>
  <body>
    <header>
      <b>tab-agent</b>
      <span class="status" id="status">booting…</span>
      <span style="flex:1"></span>
      <input id="key" type="password" placeholder="OpenRouter key (sk-or-…)" style="width:220px" />
      <button id="savekey">Save key</button>
      <button id="pick">Mount a folder</button>
    </header>
    <pre id="log"></pre>
    <footer>
      <input id="msg" placeholder="ask the agent to do something with your files…" />
      <button id="send">Send</button>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
